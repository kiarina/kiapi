use_default_settings: true

server:
  # Local-only backend; override with KIAPI_SEARXNG_SECRET in the environment.
  secret_key: "kiapi-searxng-local-dev-secret-change-me"

search:
  # kiapi consumes /search?format=json; SearXNG only enables json when listed here.
  formats:
    - html
    - json

engines:
  # SearXNG disables Bing by default. Keep another general engine available when
  # Brave, DuckDuckGo, or Startpage rate-limit this local instance.
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
