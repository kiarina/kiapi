[project]
name = "kiapi"
version = "0.8.0"
description = "Unified local inference API server for LLM agents on Apple Silicon (MLX): chat, embedding, image, music, sound-effect, and video — one process, one global memory budget, one single-flight queue, unified jobs and files."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "kiarina", email = "kiarinadawa@gmail.com" }]
keywords = [
    "agent",
    "api",
    "apple-silicon",
    "fastapi",
    "local-inference",
    "mlx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # --- web ---
    # build_openapi walks routing.iter_route_contexts, added for the lazy
    # included routers of FastAPI 0.137+.
    "fastapi>=0.141",
    "uvicorn[standard]",
    "click",
    "questionary",
    "pydantic>=2",
    "pyyaml",
    "python-multipart", # multipart/form-data (file uploads)
    # --- shared ---
    # numpy>=2.5 needs numba>=0.67 in the out-of-band LTX-2 install
    # (`kiapi activate --family ltx2` pulls mlx-video -> librosa -> numba).
    "numpy",
    "pillow",
    "psutil", # process RSS measurement (framework-agnostic fallback)
    "httpx", # web search capability: async HTTP client for the SearXNG backend
    "kiarina-utils-common>=2.2.0",
    "kiarina-utils-app>=2.3.0", # user directory resolution (replaces core/app internals)
    # --- embedding capability (mlx-embeddings) ---
    "mlx-embeddings>=0.1.0",
    # mlx-embeddings' qwen3_vl model (and mlx-video's LTX-2 text encoder) import
    # mlx-lm without declaring it; mlx-vlm stopped pulling it in at 0.7.
    "mlx-lm>=0.31.3",
    # --- sound-effect capability (mlx-audiocraft / AudioGen) ---
    "mlx-audiocraft>=0.1.0",
    "soundfile>=0.13.1",
    # --- video capability (mlx-video / LTX-2 distilled) ---
    # GitHub-only upstream is installed by `kiapi activate --family ltx2`
    # as a PythonPackageResource to keep PyPI metadata free of direct URLs.
    # --- chat capability (mlx-vlm) ---
    # mlx-vlm supports BOTH model_types we use in one install:
    #   qwen3_omni_moe (Qwen3-Omni), qwen3_5 (Qwen3.8-27B) and qwen4_exp (Qwen3.8-Flash-Next).
    # Pinned exactly because the chat capability patches its internals;
    # remaining workarounds tracked in src/kiapi/capabilities/chat/README.md.
    "mlx-vlm==0.7.1",
    # transformers' Qwen processors need torch/torchvision (video/image) and
    # torchaudio; mlx-vlm itself does not pull them in.
    "torch",
    "torchvision",
    "torchaudio",
    "mflux>=0.20.0",
    "pydantic-settings-manager>=3.8.0",
]

[project.scripts]
kiapi = "kiapi.cli.cli:main"

[project.urls]
Homepage = "https://github.com/kiarina/kiapi"
Repository = "https://github.com/kiarina/kiapi"
Documentation = "https://kiarina.github.io/kiapi/"
Changelog = "https://github.com/kiarina/kiapi/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiapi"]
artifacts = [
    "src/kiapi/capabilities/web/resources/searxng/settings.yml",
    # Built by `mise run web:build`; gitignored, so listed explicitly.
    "src/kiapi/api/ui/static/**",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]
# `uv build` makes the wheel from the sdist, so the built UI must ride along here too.
artifacts = ["src/kiapi/api/ui/static/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# The development lockfile resolves on Apple Silicon (kiapi pulls MLX wheels).
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
# Opt-in Qwen3.8 image and Omni media-prefix APC, pending upstream releases.
# Published wheels retain the official 0.7.1 dependency and conservative fallback.
mlx-vlm = { git = "https://github.com/kiarina/mlx-vlm.git", rev = "6581ba8c2f2dbc8b994cb0a350532a4bec59abc2" }
# Qwen-Image-2.1 editing and RGBA output (mflux-community/mflux#741), pending upstream release.
mflux = { git = "https://github.com/kiarina/mflux.git", rev = "144a6becfb587bcaa0139758131faf0a7930ae18" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.14.1",
    "ruff>=0.12.1",
    "types-PyYAML>=6.0.12.20250915",
    "httpx2>=2.4.0",
]
lint = [
    "mypy>=1.14.1",
    "ruff>=0.12.1",
    "types-PyYAML>=6.0.12.20250915",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
follow_imports = "silent"
incremental = true

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long: let the formatter handle it (ignore long strings/comments)
    "B008", # function call in argument defaults: required for FastAPI Depends()
]

[tool.ruff.lint.isort]
known-first-party = ["kiapi"]
