name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    env:
      MISE_GITHUB_ATTESTATIONS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.5.0
          cache: true
          install: false

      - name: Run CI pipeline
        env:
          # Authenticate GitHub API calls (test-assets:download) to avoid the
          # 60 req/h unauthenticated rate limit shared across hosted runner IPs.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ci
