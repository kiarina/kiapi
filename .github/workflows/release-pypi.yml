name: Release PyPI

on:
  push:
    tags:
      # Unified repository tag: v<version>, e.g. v0.3.0
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build release artifacts
    runs-on: macos-15
    env:
      MISE_GITHUB_ATTESTATIONS: "false"
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      version: ${{ steps.parse.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Parse version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag:     $TAG"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          cache: true
          install: false

      - name: Setup tools via mise
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync --all-extras --all-groups

      - name: Run release checks
        run: mise run ci --no-setup

      - name: Build the selected packages
        run: mise run release:build "${{ steps.parse.outputs.version }}"

      - name: Collect the selected packages
        id: packages
        run: |
          PACKAGES=$(mise run package:list --release "${{ steps.parse.outputs.version }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.parse.outputs.version }}"

          if mise run changelog:extract "$VERSION" --output /tmp/release_notes.md; then
            echo "use_auto_notes=false" >> "$GITHUB_OUTPUT"
            cat /tmp/release_notes.md
          else
            echo "use_auto_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ steps.changelog.outputs.use_auto_notes == 'false' && '/tmp/release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.use_auto_notes == 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package }}/

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Select package distributions
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          DIST_NAME=${PACKAGE//-/_}
          mkdir publish
          find dist -maxdepth 1 -type f \
            \( -name "$DIST_NAME-*.whl" -o -name "$DIST_NAME-*.tar.gz" \) \
            -exec cp {} publish/ \;
          test -n "$(find publish -type f -print -quit)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true
          verbose: true
