version: 2

updates:
  # Python dependencies are declared in pyproject.toml and pinned in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mlx-vlm is deliberately pinned to an exact version because the chat
      # capability ships patches against it. Raising it requires re-auditing
      # every patch in packages/kiapi/src/kiapi/capabilities/chat/README.md and
      # re-verifying both the omni and vlm models, so it is never an automatic
      # update.
      - dependency-name: "mlx-vlm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
